services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"

  nfgda-service:
    build:
      context: ./nfgda_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - backend
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS}
      - MAX_NO_DATA_POLLS=${MAX_NO_DATA_POLLS}
      - FILE_EXPIRATION_TIME=${FILE_EXPIRATION_TIME}
      - AUTO_REFRESH_POLL_INTERVAL=${AUTO_REFRESH_POLL_INTERVAL}
      - STATION_JOB_COOLDOWN_MINUTES=${STATION_JOB_COOLDOWN_MINUTES}
    volumes:
      - ./nfgda_output:/nfgda_output
      - ./processed_data:/processed_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - MAX_JOB_DURATION=${MAX_JOB_DURATION}
      - STATION_JOB_COOLDOWN_MINUTES=${STATION_JOB_COOLDOWN_MINUTES}
    volumes:
      - ./nfgda_output:/nfgda_output
      - ./processed_data:/processed_data