services:
 redis:
   image: redis:7-alpine
   ports:
     - "${REDIS_PORT}:6379"
   healthcheck:
     test: ["CMD", "redis-cli", "ping"]
     interval: 5s
     timeout: 3s
     retries: 10
     start_period: 5s
   networks:
     - nfgda_net
   ipv4_address: ${REDIS_HOST}

 nfgda-service:
   build:
     context: ./nfgda_service
     dockerfile: Dockerfile
   ports:
     - "8000:8000"
   depends_on:
     redis:
       condition: service_healthy
     backend:
       condition: service_started
   environment:
     - REDIS_HOST=${REDIS_HOST}
     - REDIS_PORT=${REDIS_PORT}
     - REDIS_DB=${REDIS_DB}
     - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS}
     - MAX_NO_DATA_POLLS=${MAX_NO_DATA_POLLS}
     - FILE_EXPIRATION_TIME=${FILE_EXPIRATION_TIME}
   volumes:
     - ./nfgda_output:/nfgda_output
     - ./processed_data:/processed_data
   networks:
     - nfgda_net

 frontend:
   build:
     context: ./frontend
     dockerfile: Dockerfile
   ports:
     - "5173:5173"
   # volumes:
   #   - ./frontend:/app
   #   - /app/node_modules
   depends_on:
     backend:
       condition: service_healthy
   networks:
     - nfgda_net

 backend:
   build:
     context: ./backend
     dockerfile: Dockerfile
   ports:
     - "8001:8001"
   depends_on:
     redis:
       condition: service_healthy
   environment:
     - REDIS_HOST=${REDIS_HOST}
     - REDIS_PORT=${REDIS_PORT}
     - REDIS_DB=${REDIS_DB}
     - MAX_JOB_DURATION=${MAX_JOB_DURATION}
   volumes:
     - ./nfgda_output:/nfgda_output
     - ./processed_data:/processed_data
   networks:
     - nfgda_net

networks:
 nfgda_net:
   driver: bridge
